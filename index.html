<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SHAZAM">
<meta name="theme-color" content="#1A44C8">
<title>SHAZAM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F0EFED; --surface:#FFFFFF; --surface2:#F5F4F2; --border:#E2E1DE;
  --accent:#1A44C8; --ink:#0E1B3D;
  --bolt:#FFC72C; --bolt-deep:#F0A500;
  --text:#1A1A1A; --muted:#6B7280; --light:#727A86;
  --green:#16A34A; --green-tint:#F0FDF4; --red:#EF4444; --red-tint:#FEF2F2;
  --tint:#EEF1FB;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;overflow-x:hidden;padding-bottom:env(safe-area-inset-bottom);}

.header{position:sticky;top:0;z-index:100;background:linear-gradient(120deg,var(--ink),var(--accent) 140%);
  color:#fff;padding:calc(env(safe-area-inset-top) + 14px) 20px 14px;display:flex;align-items:center;justify-content:space-between;overflow:hidden;}
.header::after{content:"";position:absolute;right:-30px;top:-30px;width:160px;height:160px;
  background:radial-gradient(circle,rgba(255,199,44,.18),transparent 70%);pointer-events:none;}
.logo{font-family:'Bebas Neue',sans-serif;font-size:30px;letter-spacing:4px;display:flex;align-items:center;gap:8px;line-height:1;}
.logo .bolt{color:var(--bolt);filter:drop-shadow(0 2px 3px rgba(0,0,0,.3));font-size:26px;}
.ver{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:0;color:var(--bolt);opacity:.85;font-weight:500;align-self:flex-start;margin:3px 0 0 2px;}
.hstat{text-align:right;}
.hstat-l{font-size:9px;letter-spacing:1.5px;text-transform:uppercase;opacity:.7;}
.hstat-v{font-family:'Bebas Neue',sans-serif;font-size:24px;color:var(--bolt);letter-spacing:1px;}

.nav{display:flex;background:var(--surface);border-bottom:1px solid var(--border);}
.nav-btn{flex:1;font-family:'DM Sans';font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1px;
  padding:13px 4px;background:none;border:none;color:var(--muted);border-bottom:2.5px solid transparent;cursor:pointer;}
.nav-btn.active{color:var(--accent);border-color:var(--bolt);}

.wrap{padding:18px 16px 90px;max-width:640px;margin:0 auto;}
.page{display:none;} .page.active{display:block;}

.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:0 1px 3px rgba(14,27,61,.04);}
.eyebrow{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);font-weight:600;}
.title-xl{font-family:'Bebas Neue';font-size:34px;letter-spacing:1px;line-height:1;color:var(--ink);}
.title-l{font-family:'Bebas Neue';font-size:26px;letter-spacing:.5px;color:var(--ink);line-height:1;}
.sub{color:var(--muted);font-size:13px;margin-top:3px;}
.hero{background:linear-gradient(125deg,var(--ink),var(--accent));color:#fff;border:none;position:relative;overflow:hidden;}
.hero::before{content:"\26A1";position:absolute;right:-6px;bottom:-24px;font-size:120px;opacity:.10;line-height:1;}
.hero .eyebrow{color:var(--bolt);} .hero .title-xl{color:#fff;} .hero .sub{color:rgba(255,255,255,.8);}

.btn{display:block;width:100%;font-family:'DM Sans';font-weight:700;font-size:15px;letter-spacing:.5px;
  padding:15px;border-radius:12px;border:none;cursor:pointer;text-align:center;transition:transform .08s;}
.btn:active{transform:scale(.98);}
.btn:disabled{opacity:.5;cursor:default;}
.btn-bolt{background:var(--bolt);color:var(--ink);text-transform:uppercase;box-shadow:0 3px 0 var(--bolt-deep);}
.btn-primary{background:var(--accent);color:#fff;}
.btn-ghost{background:var(--surface2);color:var(--text);border:1px solid var(--border);}
.btn-sm{padding:9px 14px;font-size:13px;width:auto;display:inline-block;border-radius:9px;}
.btn-row{display:flex;gap:8px;}
.hero .btn-ghost{background:rgba(255,255,255,.15);border-color:rgba(255,255,255,.3);color:#fff;}

.r-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:12px;}
.chip{display:inline-block;background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:3px 10px;color:var(--muted);font-size:11px;white-space:nowrap;}
.chip.ok{background:var(--green-tint);color:#15803D;border-color:#BBF7D0;}
.chip.todo{background:#FFF7E0;color:var(--bolt-deep);border-color:#F4E2A8;}

.chg{padding:10px 0;border-top:1px solid var(--border);}
.chg:first-child{border-top:none;}
.chg-top{display:flex;align-items:center;justify-content:space-between;gap:10px;}
.chg-name{font-weight:700;font-size:15px;line-height:1.2;}
.chg-w{display:flex;align-items:center;gap:6px;font-family:'DM Mono';font-size:14px;color:var(--muted);white-space:nowrap;}
.why{font-size:12px;color:var(--muted);margin-top:3px;line-height:1.4;}
.last{font-family:'DM Mono';font-size:11px;color:var(--light);margin-top:3px;}
.k-up{color:var(--green);} .k-down{color:var(--red);} .k-reset{color:var(--accent);}
.key{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;font-weight:600;color:var(--ink);margin:-4px 2px 14px;}
input[type=number]{font-family:'DM Mono';font-size:16px;width:80px;padding:7px;border:1.5px solid var(--border);border-radius:9px;text-align:center;background:var(--surface);color:var(--text);}
input[type=number]:focus{outline:none;border-color:var(--accent);}
input.edited{border-color:var(--bolt-deep);background:#FFFBEC;}
.flag{background:#FFF7E0;border:1px solid #F4E2A8;color:#7a5c12;border-radius:9px;padding:7px 10px;font-size:12px;margin-top:8px;line-height:1.4;}
.struct{background:var(--surface2);border-radius:9px;padding:8px 10px;font-size:12px;color:var(--muted);margin:10px 0 0;line-height:1.5;}
.toggle{background:none;border:none;color:var(--accent);font-weight:700;font-size:13px;cursor:pointer;padding:10px 0 4px;}
.allx{border-top:1px dashed var(--border);margin-top:6px;}
.send{margin-top:12px;}

.field{margin-bottom:14px;}
.field label{display:block;font-size:12px;font-weight:600;margin-bottom:5px;}
.field .help{font-size:11px;color:var(--muted);margin-top:4px;line-height:1.4;}
.field input{width:100%;font-family:'DM Mono';font-size:14px;padding:11px;border:1.5px solid var(--border);border-radius:9px;background:var(--surface);}
.empty{text-align:center;color:var(--muted);padding:30px 10px;font-size:14px;line-height:1.5;}
.err{background:var(--red-tint);border:1px solid #F8C9C9;color:#B91C1C;border-radius:11px;padding:12px;font-size:13px;margin-bottom:14px;line-height:1.4;}

.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 24px);transform:translateX(-50%) translateY(20px);
  background:var(--ink);color:#fff;padding:13px 20px;border-radius:11px;font-size:13px;font-weight:600;z-index:300;
  opacity:0;transition:.25s;pointer-events:none;max-width:90%;text-align:center;box-shadow:0 6px 24px rgba(0,0,0,.3);}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.toast.err{background:var(--red);} .toast.ok{background:var(--green);}
.modal{position:fixed;inset:0;z-index:250;background:rgba(14,27,61,.5);display:none;align-items:center;justify-content:center;padding:24px;}
.modal.on{display:flex;}
.modal-box{background:var(--surface);border-radius:16px;padding:22px;max-width:340px;width:100%;}
.modal-box .title-l{margin-bottom:8px;}
.modal-box p{font-size:14px;color:var(--muted);margin-bottom:18px;line-height:1.5;}

/* progress */
.k-skip{color:var(--light);}
.p-row{display:flex;align-items:center;gap:10px;width:100%;background:none;border:none;border-top:1px solid var(--border);padding:11px 0;text-align:left;cursor:pointer;font-family:inherit;color:var(--text);}
.card > .title-l + .p-row, .dropped summary + .p-row{border-top:none;}
.p-main{flex:1;min-width:0;}
.p-name{font-weight:700;font-size:15px;line-height:1.2;}
.p-sub{font-family:'DM Mono';font-size:11px;color:var(--light);margin-top:3px;line-height:1.4;}
.p-mark{font-size:12px;font-weight:600;margin-top:3px;}
.p-go{color:var(--light);font-size:20px;line-height:1;}
.mk{font-size:11px;}
.dropped summary{font-family:'Bebas Neue';font-size:22px;letter-spacing:.5px;color:var(--ink);cursor:pointer;}
.dropped[open] summary{margin-bottom:6px;}
.s-row{padding:11px 0;border-top:1px solid var(--border);}
.s-row:first-child{border-top:none;}
.s-top{display:flex;justify-content:space-between;gap:10px;align-items:baseline;}
.s-day{font-weight:700;font-size:14px;}
.s-rt{font-size:11px;color:var(--light);}
.s-sets{font-family:'DM Mono';font-size:13px;margin-top:4px;line-height:1.5;}
.s-mark{font-size:12px;font-weight:600;margin-top:4px;}
.p-div{font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--accent);border-top:2px dashed var(--accent);padding:8px 0 2px;text-align:center;}
.c-title{font-size:12px;font-weight:700;color:var(--ink);margin-bottom:4px;}
.c-legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-bottom:2px;}
.lg{display:inline-block;width:16px;height:0;border-top:2px solid;vertical-align:middle;margin-right:5px;}
.lg.dash{border-top-style:dashed;}
.chart{width:100%;height:auto;display:block;overflow:visible;}
.c-grid{stroke:var(--border);stroke-width:1;}
.c-ax{font-family:'DM Mono';font-size:9px;fill:var(--light);}
.c-prog{stroke:var(--accent);stroke-width:1;stroke-dasharray:3 3;opacity:.6;}
.c-line{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round;}
.c-line.dash{stroke-dasharray:5 4;}
.c-main{stroke:#1A44C8;color:#1A44C8;} .c-single{stroke:#D98E00;color:#D98E00;}
.c-pt{fill:currentColor;stroke:var(--surface);stroke-width:2;}
.c-pt.hollow{fill:var(--surface);stroke:currentColor;stroke-width:2;}
.c-bar{fill:#1A44C8;}
.c-bar.hollow{fill:var(--surface);stroke:#1A44C8;stroke-width:1.5;}
.c-hit{fill:transparent;cursor:pointer;}
circle.c-hit.on{fill:rgba(26,68,200,.12);}
rect.c-hit.on{fill:rgba(26,68,200,.08);}
.c-tip{font-size:12px;color:var(--muted);margin-top:10px;background:var(--surface2);border-radius:9px;padding:8px 10px;line-height:1.5;min-height:48px;}
.c-tip b{color:var(--text);}

/* plate calculator */
.pc-mode{display:flex;gap:10px;margin-bottom:16px;}
.pc-mode button{flex:1;padding:13px 10px;border-radius:11px;border:2px solid var(--border);background:var(--surface2);color:var(--muted);font-weight:700;font-size:13px;cursor:pointer;line-height:1.25;}
.pc-mode button.sel{border-color:var(--accent);background:var(--tint);color:var(--accent);}
.pc-mode small{display:block;font-weight:400;font-size:10px;margin-top:3px;}
.pc-wt{display:flex;align-items:center;justify-content:center;gap:8px;margin:4px 0 2px;}
.pc-wt input{font-size:26px;width:120px;padding:10px;border-radius:11px;}
.pc-adj{display:flex;gap:6px;margin:12px 0;}
.pc-adj button{flex:1;padding:11px 0;border:1.5px solid var(--border);border-radius:9px;background:var(--surface);font-family:'DM Mono';font-size:13px;font-weight:600;cursor:pointer;color:var(--text);}
.pc-stack{display:flex;align-items:flex-end;justify-content:center;gap:3px;flex-wrap:wrap;min-height:90px;margin:18px 0 10px;}
.pc-plate{min-width:30px;border-radius:4px;display:flex;align-items:center;justify-content:center;color:#fff;font-family:'DM Mono';font-size:10px;font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.22);padding:0 3px;}
.pc-side{text-align:center;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1.5px;font-weight:600;}
.pc-total{text-align:center;font-family:'Bebas Neue';font-size:34px;color:var(--ink);letter-spacing:1px;line-height:1;margin-top:6px;}
.pc-note{text-align:center;font-size:12px;color:var(--muted);margin-top:6px;}
.pc-note.warn{color:var(--bolt-deep);}
</style>
</head>
<body>

<div class="header">
  <div class="logo"><span class="bolt">&#9889;</span>SHAZAM<span class="ver" id="ver"></span></div>
  <div class="hstat">
    <div class="hstat-l">Next bench single</div>
    <div class="hstat-v" id="h-single">&mdash;</div>
  </div>
</div>

<div class="nav">
  <button class="nav-btn active" data-pg="targets">Targets</button>
  <button class="nav-btn" data-pg="progress">Progress</button>
  <button class="nav-btn" data-pg="plates">Plates</button>
  <button class="nav-btn" data-pg="settings">Settings</button>
</div>

<div class="wrap">
  <div class="page active" id="page-targets"></div>
  <div class="page" id="page-progress"></div>
  <div class="page" id="page-plates"></div>
  <div class="page" id="page-settings"></div>
</div>

<div class="toast" id="toast"></div>
<div class="modal" id="modal"><div class="modal-box">
  <div class="title-l" id="modal-t"></div><p id="modal-p"></p>
  <div class="btn-row"><button class="btn btn-ghost btn-sm" style="flex:1" id="modal-no">Cancel</button>
  <button class="btn btn-primary btn-sm" style="flex:1" id="modal-ok">OK</button></div>
</div></div>

<script type="module" src="app.js"></script>
</body>
</html>
